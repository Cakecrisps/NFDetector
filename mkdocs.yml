site_name: NFDetector
site_description: Установка, эксплуатация и архитектура NFDetector
docs_dir: docs
site_dir: documentation
use_directory_urls: false
strict: true
theme:
  name: mkdocs
  custom_dir: scripts/docs_theme
  locale: ru
  color_mode: auto
  user_color_mode_toggle: true
  highlightjs: false
plugins:
  - search:
      lang: [ru, en]
markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
validation:
  links:
    not_found: warn
    anchors: warn
nav:
  - Начало: index.md
  - Установка:
      - Сервер и TLS: getting-started/server.md
      - Агент: getting-started/agent.md
      - Локальный анализ: getting-started/local.md
  - Работа с системой:
      - Панель: guides/panel.md
      - Настройки и детекторы: guides/configuration.md
      - Инциденты: guides/incidents.md
      - Эксплуатация: guides/operations.md
      - Диагностика: guides/troubleshooting.md
  - Архитектура:
      - Поток данных: architecture/overview.md
      - API и данные: architecture/api.md
      - Ограничения: architecture/limitations.md
  - Состояние проекта:
      - Что реализовано: project/status.md
      - Оценка и план: project/assessment.md
      - Проверка репозитория: project/audit.md
  - Разработка:
      - Тесты: development/testing.md
      - Производительность: development/performance.md
      - Сборка документации: development/documentation.md
      - Справочник кода: development/reference.md
