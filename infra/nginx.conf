worker_processes auto;
events { worker_connections 1024; }
http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_max_body_size 32m;
    client_body_timeout 60s;
    limit_req_zone $binary_remote_addr zone=ingest:10m rate=20r/s;
    upstream api { server api:8000; keepalive 32; }
    server {
        listen 8443 ssl;
        ssl_certificate /etc/nf/tls/server.crt;
        ssl_certificate_key /etc/nf/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / {
            limit_req zone=ingest burst=40 nodelay;
            limit_req_status 429;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
        }
    }
}
